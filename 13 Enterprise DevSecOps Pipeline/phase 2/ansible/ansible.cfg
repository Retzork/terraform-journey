[defaults]
# Disable host key checking for dynamic inventory
host_key_checking = False
# Set the inventory file location
inventory = inventory/hosts.yml
# Reduce SSH timeout for faster failure detection
timeout = 60

[connection]
# Use WinRM connection plugin for Windows hosts
plugin = winrm

[winrm]
# WinRM connection settings for Windows jumpbox
transport = ntlm
port = 5986
scheme = https
# Disable certificate validation (self-signed cert in learning environment)
server_cert_validation = ignore
read_timeout_sec = 60
operation_timeout_sec = 50
