---
# CIS Microsoft Windows Server 2022 Benchmark Level 1 Hardening
# This role applies security hardening based on CIS benchmarks for Windows Server 2022.

# =============================================================================
# Section 1: Audit Policies
# Configure advanced audit policies for security event logging
# =============================================================================

- name: "CIS 17.1.1 | Enable Audit Credential Validation (Success and Failure)"
  win_shell: |
    auditpol /set /subcategory:"Credential Validation" /success:enable /failure:enable
  changed_when: false

- name: "CIS 17.2.1 | Enable Audit Application Group Management (Success and Failure)"
  win_shell: |
    auditpol /set /subcategory:"Application Group Management" /success:enable /failure:enable
  changed_when: false

- name: "CIS 17.2.2 | Enable Audit Computer Account Management (Success)"
  win_shell: |
    auditpol /set /subcategory:"Computer Account Management" /success:enable
  changed_when: false

- name: "CIS 17.2.3 | Enable Audit Other Account Management Events (Success)"
  win_shell: |
    auditpol /set /subcategory:"Other Account Management Events" /success:enable
  changed_when: false

- name: "CIS 17.2.4 | Enable Audit Security Group Management (Success)"
  win_shell: |
    auditpol /set /subcategory:"Security Group Management" /success:enable
  changed_when: false

- name: "CIS 17.2.5 | Enable Audit User Account Management (Success and Failure)"
  win_shell: |
    auditpol /set /subcategory:"User Account Management" /success:enable /failure:enable
  changed_when: false

- name: "CIS 17.5.1 | Enable Audit Account Lockout (Failure)"
  win_shell: |
    auditpol /set /subcategory:"Account Lockout" /failure:enable
  changed_when: false

- name: "CIS 17.5.2 | Enable Audit Logon (Success and Failure)"
  win_shell: |
    auditpol /set /subcategory:"Logon" /success:enable /failure:enable
  changed_when: false

- name: "CIS 17.5.3 | Enable Audit Other Logon/Logoff Events (Success and Failure)"
  win_shell: |
    auditpol /set /subcategory:"Other Logon/Logoff Events" /success:enable /failure:enable
  changed_when: false

- name: "CIS 17.5.4 | Enable Audit Special Logon (Success)"
  win_shell: |
    auditpol /set /subcategory:"Special Logon" /success:enable
  changed_when: false

- name: "CIS 17.6.1 | Enable Audit Detailed File Share (Failure)"
  win_shell: |
    auditpol /set /subcategory:"Detailed File Share" /failure:enable
  changed_when: false

- name: "CIS 17.6.2 | Enable Audit File Share (Success and Failure)"
  win_shell: |
    auditpol /set /subcategory:"File Share" /success:enable /failure:enable
  changed_when: false

- name: "CIS 17.7.1 | Enable Audit Audit Policy Change (Success and Failure)"
  win_shell: |
    auditpol /set /subcategory:"Audit Policy Change" /success:enable /failure:enable
  changed_when: false

- name: "CIS 17.7.2 | Enable Audit Authentication Policy Change (Success)"
  win_shell: |
    auditpol /set /subcategory:"Authentication Policy Change" /success:enable
  changed_when: false

- name: "CIS 17.8.1 | Enable Audit Sensitive Privilege Use (Success and Failure)"
  win_shell: |
    auditpol /set /subcategory:"Sensitive Privilege Use" /success:enable /failure:enable
  changed_when: false

- name: "CIS 17.9.1 | Enable Audit Security State Change (Success)"
  win_shell: |
    auditpol /set /subcategory:"Security State Change" /success:enable
  changed_when: false

- name: "CIS 17.9.2 | Enable Audit Security System Extension (Success and Failure)"
  win_shell: |
    auditpol /set /subcategory:"Security System Extension" /success:enable /failure:enable
  changed_when: false

- name: "CIS 17.9.3 | Enable Audit System Integrity (Success and Failure)"
  win_shell: |
    auditpol /set /subcategory:"System Integrity" /success:enable /failure:enable
  changed_when: false

# =============================================================================
# Section 2: Disable Unnecessary Services
# Reduce attack surface by disabling services not required for jumpbox role
# =============================================================================

- name: "CIS 5.1 | Disable Print Spooler service"
  win_service:
    name: Spooler
    start_mode: disabled
    state: stopped

- name: "CIS 5.2 | Disable Remote Registry service"
  win_service:
    name: RemoteRegistry
    start_mode: disabled
    state: stopped

- name: "CIS 5.3 | Disable Windows Search service"
  win_service:
    name: WSearch
    start_mode: disabled
    state: stopped

- name: "CIS 5.4 | Disable Xbox services"
  win_service:
    name: "{{ item }}"
    start_mode: disabled
    state: stopped
  loop:
    - XblAuthManager
    - XblGameSave
    - XboxNetApiSvc
    - XboxGipSvc
  ignore_errors: true

- name: "CIS 5.5 | Disable SSDP Discovery service"
  win_service:
    name: SSDPSRV
    start_mode: disabled
    state: stopped

- name: "CIS 5.6 | Disable UPnP Device Host service"
  win_service:
    name: upnphost
    start_mode: disabled
    state: stopped

- name: "CIS 5.7 | Disable Windows Error Reporting service"
  win_service:
    name: WerSvc
    start_mode: disabled
    state: stopped

- name: "CIS 5.8 | Disable IIS Admin Service (if present)"
  win_service:
    name: IISADMIN
    start_mode: disabled
    state: stopped
  ignore_errors: true

# =============================================================================
# Section 3: Registry Keys for Security Settings
# Configure security-related registry values per CIS benchmarks
# =============================================================================

- name: "CIS 2.3.10.1 | Disable anonymous SID/Name translation"
  win_regedit:
    path: HKLM:\SYSTEM\CurrentControlSet\Control\Lsa
    name: TurnOffAnonymousBlock
    data: 1
    type: dword

- name: "CIS 2.3.10.2 | Restrict anonymous enumeration of SAM accounts"
  win_regedit:
    path: HKLM:\SYSTEM\CurrentControlSet\Control\Lsa
    name: RestrictAnonymousSAM
    data: 1
    type: dword

- name: "CIS 2.3.10.3 | Restrict anonymous enumeration of SAM accounts and shares"
  win_regedit:
    path: HKLM:\SYSTEM\CurrentControlSet\Control\Lsa
    name: RestrictAnonymous
    data: 1
    type: dword

- name: "CIS 2.3.10.4 | Restrict remote SAM access"
  win_regedit:
    path: HKLM:\SYSTEM\CurrentControlSet\Control\Lsa
    name: RestrictRemoteSAM
    data: "O:BAG:BAD:(A;;RC;;;BA)"
    type: string

- name: "CIS 2.3.10.5 | Do not allow anonymous enumeration of SAM accounts"
  win_regedit:
    path: HKLM:\SYSTEM\CurrentControlSet\Control\Lsa
    name: EveryoneIncludesAnonymous
    data: 0
    type: dword

- name: "CIS 2.3.7.1 | Disable storage of LAN Manager hash"
  win_regedit:
    path: HKLM:\SYSTEM\CurrentControlSet\Control\Lsa
    name: NoLMHash
    data: 1
    type: dword

- name: "CIS 2.3.7.2 | Set LAN Manager authentication level to NTLMv2 only"
  win_regedit:
    path: HKLM:\SYSTEM\CurrentControlSet\Control\Lsa
    name: LmCompatibilityLevel
    data: 5
    type: dword

- name: "CIS 2.3.7.3 | Set minimum session security for NTLM SSP clients"
  win_regedit:
    path: HKLM:\SYSTEM\CurrentControlSet\Control\Lsa\MSV1_0
    name: NTLMMinClientSec
    data: 537395200
    type: dword

- name: "CIS 2.3.7.4 | Set minimum session security for NTLM SSP servers"
  win_regedit:
    path: HKLM:\SYSTEM\CurrentControlSet\Control\Lsa\MSV1_0
    name: NTLMMinServerSec
    data: 537395200
    type: dword

- name: "CIS 2.3.1.1 | Disable guest account"
  win_regedit:
    path: HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon
    name: AllowGuest
    data: 0
    type: dword

- name: "CIS 18.4.1 | Disable SMBv1 client"
  win_regedit:
    path: HKLM:\SYSTEM\CurrentControlSet\Services\mrxsmb10
    name: Start
    data: 4
    type: dword

- name: "CIS 18.4.2 | Disable SMBv1 server"
  win_regedit:
    path: HKLM:\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters
    name: SMB1
    data: 0
    type: dword

- name: "CIS 18.5.1 | Enable Windows Firewall - Domain Profile"
  win_regedit:
    path: HKLM:\SOFTWARE\Policies\Microsoft\WindowsFirewall\DomainProfile
    name: EnableFirewall
    data: 1
    type: dword

- name: "CIS 18.5.2 | Enable Windows Firewall - Private Profile"
  win_regedit:
    path: HKLM:\SOFTWARE\Policies\Microsoft\WindowsFirewall\StandardProfile
    name: EnableFirewall
    data: 1
    type: dword

- name: "CIS 18.5.3 | Enable Windows Firewall - Public Profile"
  win_regedit:
    path: HKLM:\SOFTWARE\Policies\Microsoft\WindowsFirewall\PublicProfile
    name: EnableFirewall
    data: 1
    type: dword

- name: "CIS 18.9.1 | Disable Autoplay for all drives"
  win_regedit:
    path: HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer
    name: NoDriveTypeAutoRun
    data: 255
    type: dword

- name: "CIS 18.9.2 | Disable Autorun commands"
  win_regedit:
    path: HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer
    name: NoAutorun
    data: 1
    type: dword

- name: "CIS 18.9.3 | Enable screen saver with password protection"
  win_regedit:
    path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\Control Panel\Desktop
    name: ScreenSaverIsSecure
    data: "1"
    type: string

- name: "CIS 18.9.4 | Set screen saver timeout to 900 seconds (15 minutes)"
  win_regedit:
    path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\Control Panel\Desktop
    name: ScreenSaveTimeOut
    data: "900"
    type: string

- name: "CIS 2.3.2.1 | Configure audit for access of global system objects"
  win_regedit:
    path: HKLM:\SYSTEM\CurrentControlSet\Control\Lsa
    name: AuditBaseObjects
    data: 0
    type: dword

- name: "CIS 18.3.1 | Enable Structured Exception Handling Overwrite Protection (SEHOP)"
  win_regedit:
    path: HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\kernel
    name: DisableExceptionChainValidation
    data: 0
    type: dword

- name: "CIS 18.3.2 | Enable Data Execution Prevention (DEP)"
  win_shell: |
    bcdedit /set nx AlwaysOn
  changed_when: false

# =============================================================================
# Section 4: Password Policies
# Configure password complexity and length requirements
# =============================================================================

- name: "CIS 1.1.1 | Set minimum password length to 14 characters"
  win_shell: |
    net accounts /minpwlen:14
  changed_when: false

- name: "CIS 1.1.2 | Set password history to 24 passwords"
  win_shell: |
    net accounts /uniquepw:24
  changed_when: false

- name: "CIS 1.1.3 | Set maximum password age to 365 days"
  win_shell: |
    net accounts /maxpwage:365
  changed_when: false

- name: "CIS 1.1.4 | Set minimum password age to 1 day"
  win_shell: |
    net accounts /minpwage:1
  changed_when: false

- name: "CIS 1.1.5 | Enable password complexity requirements"
  win_shell: |
    secedit /export /cfg C:\Windows\Temp\secpol.cfg
    (Get-Content C:\Windows\Temp\secpol.cfg) -replace 'PasswordComplexity = 0', 'PasswordComplexity = 1' | Set-Content C:\Windows\Temp\secpol.cfg
    secedit /configure /db C:\Windows\Security\Database\secedit.sdb /cfg C:\Windows\Temp\secpol.cfg /areas SECURITYPOLICY
    Remove-Item C:\Windows\Temp\secpol.cfg -Force
  changed_when: false

- name: "CIS 1.1.6 | Disable reversible encryption for passwords"
  win_shell: |
    secedit /export /cfg C:\Windows\Temp\secpol.cfg
    (Get-Content C:\Windows\Temp\secpol.cfg) -replace 'ClearTextPassword = 1', 'ClearTextPassword = 0' | Set-Content C:\Windows\Temp\secpol.cfg
    secedit /configure /db C:\Windows\Security\Database\secedit.sdb /cfg C:\Windows\Temp\secpol.cfg /areas SECURITYPOLICY
    Remove-Item C:\Windows\Temp\secpol.cfg -Force
  changed_when: false

# =============================================================================
# Section 5: Account Lockout Policies
# Protect against brute-force attacks
# =============================================================================

- name: "CIS 1.2.1 | Set account lockout threshold to 5 invalid attempts"
  win_shell: |
    net accounts /lockoutthreshold:5
  changed_when: false

- name: "CIS 1.2.2 | Set account lockout duration to 15 minutes"
  win_shell: |
    net accounts /lockoutduration:15
  changed_when: false

- name: "CIS 1.2.3 | Set reset account lockout counter after 15 minutes"
  win_shell: |
    net accounts /lockoutwindow:15
  changed_when: false
